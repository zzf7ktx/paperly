name: Build apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-portable:
    name: Portable app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable app
        run: npm run build:portable

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: portable-app
          path: |
            portable-build/**
            !portable-build/**/*.map

  build-electron:
    name: Electron app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-app
          path: |
            electron-dist/**
            !electron-dist/**/*.blockmap
