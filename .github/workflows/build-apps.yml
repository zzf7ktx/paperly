name: Build and release apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    name: Portable app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable app
        run: npm run build:portable

      - name: Archive portable app
        run: |
          cd portable-build
          zip -r ../paperly-portable.zip .

      - name: Upload portable app to release
        uses: softprops/action-gh-release@v2
        with:
          files: paperly-portable.zip

  build-electron:
    name: Electron app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
